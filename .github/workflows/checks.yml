name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playtest:
    name: build and playtest
    runs-on: ubuntu-latest
    # Phase 2 made the walkthrough a round trip — each cell is carried back to
    # the airlock — so the on-foot leg roughly doubled. Phase 5 added two more
    # harnesses, and the consumption gate is the dearest thing here: it plays a
    # complete run and then walks on each surface until it has heard every
    # footstep variant. The runners render in software at a third of real time.
    timeout-minutes: 85

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The generators are deterministic, so whatever is committed under
      # public/assets must be exactly what the pipeline produces. This catches
      # a generator being changed without its output being regenerated, and
      # the reverse — an asset edited by hand that no generator would emit.
      - name: Assets match their generators
        run: |
          rm -rf public/assets
          npm run pipeline
          git diff --exit-code --stat -- public/assets

      # Needs no browser and no server: the claim is about the generated data,
      # so it reads the responses off disk and measures them.
      - name: Compartment acoustics match their rooms
        run: node tools/acoustics.mjs

      - run: npm run build

      - name: Serve the built site
        run: |
          nohup npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then
              echo "preview up"
              exit 0
            fi
            sleep 1
          done
          echo "preview server never came up"; cat /tmp/preview.log; exit 1

      # Twelve altitudes. chain drives the interactions directly and proves the
      # six steps refuse to work out of order; deadend reasons over the whole
      # walkable floor rather than playing at all, now across both stances;
      # relief moves a lamp and measures whether the surfaces answer it;
      # consume plays the game and requires every manifest entry to be observed
      # reaching its consumer; clock holds every idle sound to the frame of the
      # motion it belongs to; replay plays recorded runs back; weight counts
      # what it costs to arrive; framecost weighs the shipped frame against a
      # stripped one; smoke teleports between rooms to reach each system
      # quickly; walkthrough refuses to teleport and so is the only one that can
      # catch the level becoming un-navigable; mobile drives the touch scheme.
      # They have caught different bugs and none subsumes another.
      - name: Playtest — the dependency chain
        run: node tools/chain.mjs http://127.0.0.1:4173/

      - name: Playtest — dead-end search, both stances
        run: node tools/deadend.mjs http://127.0.0.1:4173/

      - name: Playtest — relief is bound
        run: node tools/relief.mjs http://127.0.0.1:4173/

      - name: Playtest — signage legibility
        run: node tools/legible.mjs http://127.0.0.1:4173/

      # Phase 8. Every dead/live pair photographed in both states and compared
      # by luminance under normal vision and three simulated deficiencies; and
      # every conduit run photographed, so none can be inside its wall again.
      - name: Playtest — state reads without hue
        run: node tools/colour.mjs http://127.0.0.1:4173/

      # relief.mjs guards one instance of "generated, listed, and never
      # reaching its consumer". This guards the class — every texture, normal
      # map, model, sound and impulse response, observed in use.
      - name: Playtest — every generated asset is consumed
        run: node tools/consume.mjs http://127.0.0.1:4173/

      # Phase 6. A sound on its own timer beside a motion passes every other
      # check here — generated, consumed, panned, in the right room — so this
      # pairs what is seen with what is heard, frame by frame.
      - name: Playtest — idle sound keeps its motion's clock
        run: node tools/clock.mjs http://127.0.0.1:4173/

      # Phase 7. Recorded runs, replayed through the real input layer: two
      # round trips the harness records itself, then every committed trace in
      # tools/traces that was recorded on the current input layer.
      - name: Playtest — recorded runs replay
        run: node tools/replay.mjs http://127.0.0.1:4173/

      # Phase 8. Seeded hostile input on a desktop and two phones, invariants
      # checked every frame, then an autopilot must finish each run. Anything
      # it ever found is in tools/traces/monkey and replays first.
      - name: Playtest — monkey runs
        run: node tools/monkey.mjs http://127.0.0.1:4173/

      # Bytes to title, decoded, gated; time to title on a pinned network,
      # reported. Bytes are a fact about the game; time is partly the runner.
      - name: Playtest — the weight
        run: node tools/weight.mjs http://127.0.0.1:4173/

      # A ratio, never a frame rate: an absolute number here would be a fact
      # about this runner. One row per drawing feature since phase 6; the
      # budget, on the whole frame, is in the harness.
      - name: Playtest — the frame budget
        run: node tools/framecost.mjs http://127.0.0.1:4173/

      # Phase 8. The other half of the frame budget: absolute frame times from
      # the owner's own phone, read out of the committed traces and broken down
      # by compartment and event. Reported, never gated.
      - name: Report — frame times on the owner's phone
        run: node tools/profile.mjs http://127.0.0.1:4173/

      - name: Playtest — systems
        run: node tools/smoke.mjs http://127.0.0.1:4173/ --shots

      - name: Playtest — the route, on foot
        run: node tools/walkthrough.mjs http://127.0.0.1:4173/ --shots

      - name: Playtest — touch controls
        run: node tools/mobile.mjs http://127.0.0.1:4173/ --shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-screenshots
          path: tools/shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preview server log
        if: failure()
        run: cat /tmp/preview.log || true
